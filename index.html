<style>
/* Mise en page : grands titres, barre d'onglets en bas (barre latérale sur grand écran), cartes en dégradé façon App Store, mini-lecteur pour le minuteur, feuilles modales pour les exercices. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --fill:rgba(120,120,128,.12); --sep:rgba(60,60,67,.16);
  --fg:#111114; --dim:#6a6a70; --glass:rgba(249,249,252,.82); --accent:#0062d6; --focus:#0062d6;
  --blue:#0062d6; --green:#12803a; --orange:#b45a00; --pink:#c4194a; --rest:#6a6a70;
  --h-blue:#0a84ff; --h-green:#2fb34f; --h-orange:#ff9f0a; --h-pink:#ff375f; --h-rest:#6e6e73; --h-purple:#a550e0; --h-teal:#1d9bb5; --purple:#8e44ad; --teal:#0e7490;
  --hue:var(--blue); --hc:var(--h-blue);
  --shadow:0 2px 6px rgba(0,0,0,.06),0 12px 32px rgba(0,0,0,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",sans-serif;
  --tabh:56px; --side:0px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000; --surface:#1c1c1e; --fill:rgba(120,120,128,.24); --sep:rgba(84,84,88,.6);
  --fg:#f5f5f7; --dim:#9a9aa1; --glass:rgba(28,28,30,.8); --accent:#0a84ff; --focus:#64a8ff;
  --blue:#64a8ff; --green:#4fd17f; --orange:#ffa94a; --pink:#ff7195; --rest:#9a9aa1; --purple:#c58af9; --teal:#4fd1e0;
  --shadow:0 2px 6px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000; --surface:#1c1c1e; --fill:rgba(120,120,128,.24); --sep:rgba(84,84,88,.6);
  --fg:#f5f5f7; --dim:#9a9aa1; --glass:rgba(28,28,30,.8); --accent:#0a84ff; --focus:#64a8ff;
  --blue:#64a8ff; --green:#4fd17f; --orange:#ffa94a; --pink:#ff7195; --rest:#9a9aa1; --purple:#c58af9; --teal:#4fd1e0;
  --shadow:0 2px 6px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.4 var(--font);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(52px + env(safe-area-inset-top,0px));padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 96px)}
h1,h2,h3,h4,p,ol,ul,figure{margin:0}
ol,ul{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
.wrap{max-width:760px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* ---- barre de navigation (titre compact au défilement) ---- */
.nb{position:fixed;inset:0 0 auto 0;z-index:40;height:calc(52px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;transition:background .2s,border-color .2s;border-bottom:1px solid transparent}
.nb.on{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom-color:var(--sep)}
.nb-t{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:52vw;overflow:hidden;text-overflow:ellipsis}
.nb.on .nb-t{opacity:1}
.nb-l{justify-self:start}.nb-r{justify-self:end}
.back{display:inline-flex;align-items:center;gap:2px;height:44px;color:var(--accent);font-size:17px;padding-right:8px}
.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center}
.cbtn svg{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb.on .cbtn{background:transparent}

/* ---- barre d'onglets ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:center;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border-top:1px solid var(--sep);padding:6px max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabbar-in{display:flex;width:100%;max-width:560px}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 2px;min-height:48px;color:var(--dim);font-size:10.5px;font-weight:500;letter-spacing:0}
.tb svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb[aria-current="page"]{color:var(--accent)}

/* ---- mini-lecteur (minuteur) ---- */
.mini{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 8px);z-index:44;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));display:flex;justify-content:center;pointer-events:none}
.mini-in{pointer-events:auto;width:100%;max-width:560px;display:grid;grid-template-columns:48px 1fr auto auto;gap:10px;align-items:center;padding:8px 10px 8px 8px;border-radius:18px;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);box-shadow:var(--shadow);border:1px solid var(--sep);position:relative;overflow:hidden}
.mini-art{width:48px;height:48px;border-radius:10px;padding:2px}
.mini-m{min-width:0;text-align:left;background:none;border:0;padding:0}
.mini-l{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mini-b{display:flex;gap:2px}
.mini-b button{width:40px;height:40px;border-radius:50%;border:0;background:transparent;font-size:15px;font-weight:700;display:grid;place-items:center}
.mini-b svg{width:20px;height:20px;fill:currentColor}
.mini-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--hue);width:0;transition:width .25s linear}
.mini.fast .mini-n{color:var(--hue)}

/* ---- grands titres ---- */
.lt{padding:6px 0 18px}
.lt .eb{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.lt h1,.h1{font-size:clamp(34px,8vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-top:2px;text-wrap:balance}
h2.sh{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:34px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2.sh a,h2.sh .more{font-size:15px;font-weight:500;color:var(--accent);letter-spacing:0}
.sub{color:var(--dim);font-size:15.5px}
.eb2{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}

/* ---- cartes en dégradé ---- */
.gcard{background:linear-gradient(155deg,color-mix(in srgb,var(--hc) 72%,#000),color-mix(in srgb,var(--hc) 38%,#000));color:#fff}
.art{--fg:#fff;--dim:rgba(255,255,255,.74);--line2:rgba(255,255,255,.38);--surface:color-mix(in srgb,var(--hc) 46%,#000);--surface2:rgba(255,255,255,.14);--hue:#fff}
.art .figsvg{width:100%;height:100%}
.hero{display:grid;position:relative;overflow:hidden;border-radius:28px;min-height:380px;padding:24px;box-shadow:var(--shadow);grid-template-rows:auto 1fr auto}
.hero .hart{position:absolute;right:-4%;top:26px;width:min(60%,300px);opacity:.95;pointer-events:none}
.hero .eb2{opacity:.9;position:relative}
.hero h2{font-size:clamp(32px,8vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.05;position:relative;max-width:12ch;text-wrap:balance;align-self:end}
.hero .sub{color:rgba(255,255,255,.82);position:relative;margin-top:8px;max-width:30ch;font-size:15px}
.hero .low{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.cta{display:inline-flex;align-items:center;height:40px;padding:0 20px;border-radius:999px;background:#fff;color:#111;font-weight:600;font-size:15px}
.ringw{position:relative;width:48px;height:48px;display:grid;place-items:center}
.ringw svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringw span{font-size:12px;font-weight:700}
.ring-bg{stroke:rgba(255,255,255,.28)}.ring-fg{stroke:#fff}
.plain .ring-bg{stroke:var(--fill)}.plain .ring-fg{stroke:var(--hue)}

.card{background:var(--surface);border-radius:20px;padding:16px 18px}
.card + .card{margin-top:12px}
.callout{background:var(--surface);border-radius:16px;padding:14px 16px;font-size:15px;display:grid;gap:3px;margin-top:12px}
.callout .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--hue)}
.callout.warn .k{color:var(--orange)}

/* ---- rails horizontaux ---- */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px)) 14px;scroll-padding:0 max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start;flex:none}
.mcard{width:min(260px,72vw);height:150px;border-radius:22px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.mcard .eb2{opacity:.85}.mcard h3{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.mcard .mart{position:absolute;right:-10px;bottom:-6px;width:55%;opacity:.3}
.meal-card{width:min(280px,76vw);background:var(--surface);border-radius:22px;padding:16px;display:grid;gap:6px;align-content:start;min-height:190px}
.meal-card .mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meal-card h4{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.meal-card p{font-size:15.5px;line-height:1.38}
.tick{width:40px;height:40px;border-radius:50%;border:1.8px solid var(--sep);background:transparent;display:grid;place-items:center;flex:none}
.tick svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tick[aria-pressed="true"]{background:var(--hue);border-color:var(--hue)}
.tick[aria-pressed="true"] svg{opacity:1}
.mt{font-size:12.5px;color:var(--dim);font-weight:500}

/* ---- bande de la semaine ---- */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border-radius:20px;padding:14px 8px}
.sd{display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--dim);font-weight:600;padding:2px 0}
.sd .ringw{width:38px;height:38px}
.sd .ringw span{font-size:10.5px}
.sd.today{color:var(--fg)}
.sd.today b{background:var(--fg);color:var(--bg);border-radius:999px;padding:0 7px}
.sd i{width:38px;height:38px;border-radius:50%;border:1.8px dashed var(--sep);display:block}

/* ---- pause du midi ---- */
.tl{display:flex;height:40px;border-radius:12px;overflow:hidden;gap:2px;margin-top:12px}
.tl span{display:grid;place-items:center;font-size:11.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;min-width:0;background:color-mix(in srgb,var(--hc) 80%,#000)}
.tl span:nth-child(even){background:color-mix(in srgb,var(--hc) 52%,#000)}
.tl-l{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--dim)}

/* ---- listes style bibliothèque ---- */
.group{background:var(--surface);border-radius:20px;overflow:hidden}
.lrow{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 16px 12px 12px;width:100%;border:0;background:transparent;text-align:left;position:relative}
.lrow + .lrow::before{content:"";position:absolute;top:0;left:90px;right:0;border-top:1px solid var(--sep)}
.lrow .tn{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:4px}
.lrow .tt{min-width:0}
.lrow .t1{font-size:17px;font-weight:600;line-height:1.25;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lrow .t2{color:var(--dim);font-size:14.5px;margin-top:1px}
.lrow .ch{width:18px;height:18px;stroke:var(--dim);opacity:.6;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.lrow.rest .tn{background:var(--fill);color:var(--dim)}
.lrow.today .t1::after{content:"Aujourd’hui";font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--hue);color:#fff;border-radius:999px;padding:1px 8px}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--fill);display:block}
.dots i.on{background:var(--hue)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:6px;background:color-mix(in srgb,var(--hue) 16%,transparent);color:var(--hue)}
.tcount{font-size:13px;font-weight:600;color:var(--dim);margin-right:2px;font-variant-numeric:tabular-nums}
.lrow[data-done="1"] .tcount{color:var(--hue)}

/* ---- page séance (type album) ---- */
.album{display:grid;gap:16px;justify-items:center;text-align:center;padding:4px 0 6px}
.cover{width:min(250px,68vw);aspect-ratio:1;border-radius:26px;box-shadow:var(--shadow);padding:20px;display:grid;place-items:center;position:relative}
.cover .ringw{position:absolute;right:12px;top:12px;width:44px;height:44px}
.album h1{font-size:clamp(28px,7vw,34px);font-weight:700;letter-spacing:-.03em;line-height:1.1;text-wrap:balance}
.album .sub{margin-top:4px}
.album .meta{color:var(--hue);font-size:15px;font-weight:600;margin-top:2px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px}
.pbtn,.sbtn{height:50px;border-radius:14px;border:0;font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pbtn{background:var(--hue);color:#fff}
.pbtn svg{width:16px;height:16px;fill:currentColor}
.sbtn{background:color-mix(in srgb,var(--hue) 15%,transparent);color:var(--hue)}
.desc{margin-top:18px;font-size:16px;color:var(--fg)}

/* ---- cardio ---- */
.cardio-top{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:700px){.cardio-top{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}}

<script>
/* ============ Moteur d'illustrations : bonhomme articulé (cinématique directe + IK) ============ */
(function () {
  const L = { T: 34, th: 29, sh: 28, ua: 19, fa: 18, ft: 9, hd: 15 };
  const rad = (a) => (a * Math.PI) / 180;
  const dn = (a) => [Math.sin(rad(a)), Math.cos(rad(a))]; // angle depuis "vers le bas", + = vers l'avant (x+)
  const add = (p, v, l) => [p[0] + v[0] * l, p[1] + v[1] * l];
  const f1 = (n) => n.toFixed(1);

  function ik(A, T, l1, l2, s) {
    const dx = T[0] - A[0], dy = T[1] - A[1];
    const d0 = Math.hypot(dx, dy) || 0.001;
    const d = Math.min(Math.max(d0, Math.abs(l1 - l2) + 0.5), l1 + l2 - 0.05);
    const ux = dx / d0, uy = dy / d0;
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(l1 * l1 - a * a, 0));
    return [A[0] + ux * a - s * uy * h, A[1] + uy * a + s * ux * h];
  }

  /* ---------- vue de profil ---------- */
  function solveS(p) {
    const J = {};
    const t = p.t || 0;
    let hip, kn, an;
    if (p.lk) { hip = p.hip; an = p.lk; kn = ik(hip, an, L.th, L.sh, p.ls || 1); }
    else if (p.an) { an = p.an; kn = add(an, dn(p.sh || 0), -L.sh); hip = add(kn, dn(p.th || 0), -L.th); }
    else { hip = p.hip; kn = add(hip, dn(p.th || 0), L.th); an = add(kn, dn(p.sh || 0), L.sh); }
    const sho = add(hip, [Math.sin(rad(t)), -Math.cos(rad(t))], L.T);
    const ha = t + (p.nk || 0);
    const hd = add(sho, [Math.sin(rad(ha)), -Math.cos(rad(ha))], L.hd);
    let el, wr;
    if (p.ak) {
      const tg = p.ak === 'head' ? [hd[0] + (p.ako ? p.ako[0] : 0), hd[1] + (p.ako ? p.ako[1] : 0)] : p.ak;
      wr = tg; el = ik(sho, tg, L.ua, L.fa, p.as || 1);
    } else { el = add(sho, dn(p.ua || 0), L.ua); wr = add(el, dn(p.fa || 0), L.fa); }
    const to = add(an, dn(p.ft == null ? 90 : p.ft), L.ft);
    Object.assign(J, { hip, kn, an, to, sho, hd, el, wr });
    if (p.th2 != null) {
      J.kn2 = add(hip, dn(p.th2), L.th); J.an2 = add(J.kn2, dn(p.sh2), L.sh); J.to2 = add(J.an2, dn(p.ft2 == null ? 90 : p.ft2), L.ft);
    }
    if (p.ua2 != null) { J.el2 = add(sho, dn(p.ua2), L.ua); J.wr2 = add(J.el2, dn(p.fa2), L.fa); }
    return J;
  }

  /* ---------- vue de face ---------- */
  function solveF(p) {
    const cx = p.cx || 120, hy = p.hy || 69, b = p.b || 0, cb = Math.cos(rad(b));
    const shy = hy - L.T * cb;
    const hdy = shy - L.hd * cb + (b ? 8 * Math.sin(rad(b)) * 0.5 : 0);
    const J = { cx, hy, shy, hdy, sx: 15 };
    J.shR = [cx + 15, shy]; J.shL = [cx - 15, shy];
    const arm = (sgn) => {
      const s0 = [cx + sgn * 15, shy];
      const e = [s0[0] + sgn * L.ua * Math.sin(rad(p.ua)), s0[1] + L.ua * Math.cos(rad(p.ua))];
      const w = [e[0] + sgn * L.fa * Math.sin(rad(p.fa)), e[1] + L.fa * Math.cos(rad(p.fa))];
      return [s0, e, w];
    };
    J.aR = arm(1); J.aL = arm(-1);
    const leg = (sgn) => [[cx + sgn * 7, hy], [cx + sgn * 10, hy + L.th], [cx + sgn * 12, hy + L.th + L.sh]];
    J.lR = leg(1); J.lL = leg(-1);
    J.wrR = J.aR[2]; J.wrL = J.aL[2];
    return J;
  }

  /* ---------- helpers SVG ---------- */
  const ln = (a, b, c = 'pr', x = '') => `<line class="${c}" x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" ${x}/>`;
  const ci = (c, r, cl = 'pr') => `<circle class="${cl}" cx="${f1(c[0])}" cy="${f1(c[1])}" r="${r}"/>`;
  const poly = (pts, cl) => `<polyline class="${cl}" points="${pts.map((q) => f1(q[0]) + ',' + f1(q[1])).join(' ')}"/>`;
  const rect = (x, y, w, h, cl = 'pad', r = 2) => `<rect class="${cl}" x="${f1(x)}" y="${f1(y)}" width="${w}" height="${h}" rx="${r}"/>`;
  const FL = ln([10, 130], [230, 130], 'fl');
  const plate = (c, r = 8) => ci(c, r, 'pl') + ci(c, 1.8, 'dot');
  const dumb = (c) => ci(c, 5.5, 'db');
  const bench = (x1, x2, y) => rect(x1, y, x2 - x1, 5, 'pad') + ln([x1 + 6, y + 5], [x1 + 6, 130]) + ln([x2 - 6, y + 5], [x2 - 6, 130]);
  const unit = (a, b) => { const d = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1; return [(b[0] - a[0]) / d, (b[1] - a[1]) / d]; };

  /* ---------- dessin ---------- */
  function drawS(J) {
    let s = '';
    if (J.kn2) s += poly([J.hip, J.kn2, J.an2, J.to2], 'bd far');
    if (J.el2) s += poly([J.sho, J.el2, J.wr2], 'bd far');
    s += ln(J.hip, J.sho, 'bd tr');
    s += poly([J.hip, J.kn, J.an, J.to], 'bd');
    s += ln(J.sho, J.hd, 'bd');
    s += `<circle class="hd" cx="${f1(J.hd[0])}" cy="${f1(J.hd[1])}" r="8"/>`;
    s += poly([J.sho, J.el, J.wr], 'bd');

    },
    inner: (key, u) => frame(key, u),
  };
})();

    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    clearTimeout(saveTimer); saveTimer = setTimeout(pushRemote, 1200);
  }

  /* ---------- synchro (optionnelle) ---------- */
  let remote = null, syncMsg = 'Ta progression est enregistrée sur cet appareil.';
  const setSync = (t) => { syncMsg = t; $$('.syncmsg').forEach((el) => (el.textContent = t)); };
  async function initRemote() {
    try {
      if (remote || !window.claude || !window.claude.use) return;
      const db = await window.claude.use('db'), user = await window.claude.use('user');
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.collection('data/users/' + id).doc('programme');
      remote = { ref, busy: false, dirty: false };
      const snap = await ref.get();
      const d = snap.exists ? snap.data() : null;
      if (d && d.s && d.ut > S.ut) {
        S = norm(d.s); S.ut = d.ut;
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        applyTheme(); renderView(false);
      } else if (S.ut > 0 && (!d || S.ut > d.ut)) pushRemote();
      setSync('Ta progression est aussi enregistrée sur ton compte : tu la retrouves sur ton téléphone et ton ordinateur.');
    } catch (e) { remote = null; }
  }
  async function pushRemote() {
    if (!remote) return;
    if (remote.busy) { remote.dirty = true; return; }
    remote.busy = true;
    try { await remote.ref.set({ s: S, ut: S.ut }); } catch (e) { setSync('Synchronisation impossible pour le moment : la progression reste sur cet appareil.'); }
    remote.busy = false;
    if (remote.dirty) { remote.dirty = false; pushRemote(); }
  }

  /* ---------- thème ---------- */
  function applyTheme() {
    const r = document.documentElement;
    if (S.theme) r.setAttribute('data-theme', S.theme); else r.removeAttribute('data-theme');
  }

  /* ---------- utilitaires ---------- */
  const fmtRest = (s) => (s >= 120 && s % 60 === 0 ? s / 60 + ' min' : s + ' s');
  const mmss = (s) => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const fmtH = (m) => Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + String(m % 60).padStart(2, '0') : '');
  const dayById = (id) => DAYS.find((d) => d.id === id);
  const hv = (d) => `--hue:var(--${d.hue})`;
  const hc = (d) => `--hc:var(--h-${d.hue})`;
  const figKey = (k) => EX[k].fig || k;
  const todayIdx = (new Date().getDay() + 6) % 7;
  const cyc = () => S.cyc[S.week] || (S.week === 1 ? 4 : 6);
  const setsDone = (d) => d.ex.reduce((a, e) => a + Math.min(W().sets[d.id + ':' + e[0]] || 0, e[2]), 0);
  const setCount = (d) => d.ex.reduce((a, e) => a + e[2], 0);
  const lunchTot = (d) => d.lunch.reduce((a, b) => a + b[1], 0);

  function dayProg(d, wk) {
    if (d.type !== 'train') return null;
    const w = (wk || S.w)[S.week] || { sets: {}, cardio: {} };
    let tot = 0, done = 0;
    d.ex.forEach((e) => { tot += e[2]; done += Math.min(w.sets[d.id + ':' + e[0]] || 0, e[2]); });
    if (d.cardio) { tot += 1; done += w.cardio[d.id] ? 1 : 0; }
    return { tot, done, pct: tot ? Math.round((done / tot) * 100) : 0 };
  }
  function weekProg() {
    let tot = 0, done = 0, full = 0, n = 0;
    DAYS.forEach((d) => { const p = dayProg(d); if (p) { tot += p.tot; done += p.done; n++; if (p.pct === 100) full++; } });
    return { tot, done, full, n, pct: tot ? Math.round((done / tot) * 100) : 0 };
  }
  function ring(pct, label) {
    const C = 94.25, off = (C * (1 - pct / 100)).toFixed(2);
    return `<span class="ringw" role="img" aria-label="${pct} % fait"><svg viewBox="0 0 36 36" aria-hidden="true"><circle class="ring-bg" cx="18" cy="18" r="15" fill="none" stroke-width="3.5"/><circle class="ring-fg" cx="18" cy="18" r="15" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><span>${label == null ? pct : label}</span></span>`;
  }
  const nextTrain = (from) => { for (let i = 0; i < 7; i++) { const d = DAYS[(from + i) % 7]; if (d.type === 'train') return { d, i }; } return null; };

  /* ---------- bloc de pause du midi ---------- */
  function lunchHTML(d) {
    const tot = lunchTot(d), end = 720 + tot;
    return `<div class="card" style="${hv(d)};${hc(d)}">
      <div class="tl" role="img" aria-label="Déroulé de la pause du midi">${d.lunch.map(([l, m]) => `<span style="flex:${m}">${m >= 15 ? l : ''}</span>`).join('')}</div>
      <div class="tl-l"><span>12 h</span><span>${fmtH(end)}</span></div>
      <p class="note" style="margin-top:8px">${d.lunch.map(([l, m]) => l + ' ' + m + ' min').join(' · ')}.${end <= 840 ? ' Fini à ' + fmtH(end) + ' : il te reste ' + (840 - end) + ' min de marge avant 14 h.' : ''} Pas de douche : change-toi et repars. Prépare ton sac et ta gourde la veille.</p></div>`;
  }

  /* ---------- cartes repas ---------- */
  function mealCard(d, m, i) {
    const on = !!W().meals[d.id + ':' + i];
    return `<div class="meal-card" style="${hv(d)}"><div class="mh"><h4>${m[0]}</h4><button type="button" class="tick" data-act="meal" data-d="${d.id}" data-i="${i}" aria-pressed="${on}" aria-label="Repas pris : ${m[0]}">${IC.check}</button></div>${m[2] ? `<span class="mt">${m[2]}</span>` : ''}<p>${m[1]}</p></div>`;
  }
  const mealRail = (d) => `<div class="rail" role="list">${d.meals.map((m, i) => mealCard(d, m, i)).join('')}</div>`;

  /* ---------- vues ---------- */
  function viewToday() {
    const now = new Date();
    let ds = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    ds = ds.charAt(0).toUpperCase() + ds.slice(1);
    const td = DAYS[todayIdx], isTrain = td.type === 'train';
    const nt = nextTrain(todayIdx), hd = nt.d, p = dayProg(hd);
    const when = nt.i === 0 ? 'Aujourd’hui' : nt.i === 1 ? 'Demain' : hd.name;
    const sub = (hd.slot === 'midi' ? '12 h – ' + fmtH(720 + lunchTot(hd)) + ' · ' : '') + hd.dur;
    const hero = `<a class="hero gcard art" href="#seance-${hd.id}" style="${hc(hd)};color:#fff;--hue:#fff">
        <span class="eb2">${isTrain ? 'Aujourd’hui · séance ' + hd.n + ' sur 4' : 'Repos aujourd’hui · prochaine séance'}</span>
        <div class="hart" aria-hidden="true">${Figs.svg(figKey(hd.ex[0][0]), 1)}</div>
        <div style="align-self:end;position:relative"><h2 style="max-width:12ch">${hd.title}</h2><p class="sub">${isTrain ? sub : when + ' · ' + sub}</p></div>
        <div class="low">${ring(p.pct)}<span class="cta">${p.pct > 0 && p.pct < 100 ? 'Reprendre' : p.pct === 100 ? 'Revoir' : 'Voir la séance'}</span></div></a>`;
    const rest = !isTrain ? `<div class="callout" style="${hv(td)}"><span class="k">Récupération</span><span>${td.tip}</span></div>` : '';
    const strip = DAYS.map((d, i) => {
      const pp = dayProg(d);
      return `<a class="sd ${i === todayIdx ? 'today' : ''}" href="#seance-${d.id}" style="${hv(d)}" aria-label="${d.name}${pp ? ', ' + pp.pct + ' % fait' : ', repos'}"><b>${d.short}</b>${pp ? ring(pp.pct) : '<i></i>'}</a>`;
    }).join('');
    const upcoming = [];
    for (let i = 0; i < 7; i++) { const d = DAYS[(todayIdx + i) % 7]; if (d.type === 'train' && !(i === 0 && false)) upcoming.push(d); }
    const rail = upcoming.map((d) => `<a class="mcard gcard art" href="#seance-${d.id}" style="${hc(d)}"><span class="eb2">${d.name} · ${d.dur}</span><h3>${d.title}</h3><div class="mart" aria-hidden="true">${Figs.svg(figKey(d.ex[0][0]), 1)}</div></a>`).join('');
    return `<div class="lt"><div class="eb">${ds}</div><h1>Aujourd’hui</h1></div>
      ${hero}${rest}
      ${hd.lunch ? `<h2 class="sh">Ta pause du midi<span class="more">${hd.name}</span></h2>${lunchHTML(hd)}` : ''}
      <h2 class="sh">Menus du jour<span class="more">${td.name}</span></h2>${mealRail(td)}
      <h2 class="sh">Cette semaine<a href="#semaine">Tout voir</a></h2><div class="strip plain">${strip}</div>
      <h2 class="sh">À venir</h2><div class="rail">${rail}</div>`;
  }

  function viewWeek() {
    const wk = WEEKS[S.week - 1], wp = weekProg();
    const rows = DAYS.map((d, i) => {
      const p = dayProg(d), rest = d.type === 'rest';
      return `<a class="lrow ${rest ? 'rest' : ''} ${i === todayIdx ? 'today' : ''}" href="#seance-${d.id}" style="${hv(d)};${hc(d)}">
        <span class="tn ${rest ? '' : 'gcard art'}">${d.short}</span>
        <span class="tt"><span class="t1">${d.title}</span><span class="t2" style="display:block">${rest ? d.focus : d.focus + ' · ' + d.dur}</span></span>
        <span class="rc">${p ? `<span class="tcount">${p.pct} %</span>` : ''}${IC.chev}</span></a>`;
    }).join('');
    return `<div class="lt"><div class="eb">Programme personnalisé</div><h1>Semaine ${S.week}</h1></div>
      <div class="seg" role="group" aria-label="Semaine du programme">${[1, 2, 3, 4].map((n) => `<button type="button" data-act="week" data-w="${n}" aria-pressed="${S.week === n}">S${n}</button>`).join('')}</div>
      <div class="callout" style="--hue:var(--blue)"><span class="k">Consigne de la semaine ${S.week}</span><span><b>Musculation.</b> ${wk.mus}</span><span><b>Cardio.</b> ${wk.car}</span></div>
      <h2 class="sh">Les 7 jours<span class="more num">${wp.done}/${wp.tot} séries</span></h2>
      <div class="group">${rows}</div>
      <h2 class="sh">Le rythme</h2>
      <div class="card"><p>Deux séances pendant ta pause du midi en télétravail, <b>mardi et jeudi</b> (1 h 30 tout compris, sans douche), puis <b>vendredi</b> et <b>dimanche</b>, sans contrainte horaire. Lundi, mercredi et samedi : repos.</p>
      <p class="note" style="margin-top:8px">Jeudi et vendredi s’enchaînent : dos et biceps, puis jambes, des muscles différents. Le fractionné est placé le mardi, avec un jour de repos derrière, loin de la séance jambes.</p></div>
      <div class="tiles" style="margin-top:12px"><div class="tile"><b>4</b><span>séances par semaine</span></div><div class="tile"><b>≈ 2 650</b><span>kcal par jour</span></div></div>`;
  }

  function figBox(fk, uid, cls, style) {
    const m = Figs.meta(fk), loop = !!m.loop;
    return `<div class="figbox ${cls || ''}" style="${style || ''}" data-fig="${fk}" data-loop="${loop ? 1 : 0}">
      <div class="fighost"></div>
      <div class="figctl">
        <button type="button" class="playbtn" data-act="play" aria-label="Lancer ou mettre en pause l’animation">${IC.pause}</button>
        ${loop ? '<span class="note">Animation en boucle</span>' : `<div class="scr"><input type="range" min="0" max="100" value="0" data-act="scrub" aria-label="Position du mouvement" id="sc-${uid}"><div class="ends"><span>${m.la}</span><span>${m.lb}</span></div></div>`}
      </div></div>`;
  }
  function tlHTML(n) {
    let s = '<span class="w" style="flex:240"></span>';
    for (let i = 0; i < n; i++) s += '<span class="f" style="flex:30"></span><span class="r" style="flex:90"></span>';
    return s + '<span class="w" style="flex:180"></span>';
  }
  function cardioBlock(d) {
    const c = d.cardio, done = !!W().cardio[d.id];
    const chk = `<button type="button" class="check" data-act="cardiodone" aria-pressed="${done}"><i>${IC.check}</i>Cardio fait</button>`;
    const fb = (fk, uid) => figBox(fk, uid, 'gcard art', hc(d));
    if (c.kind === 'walk') {
      return `<div class="card" style="${hv(d)}"><div class="cardio-top">${fb('walk', 'w-' + d.id)}
        <div style="display:grid;gap:14px">
          <div class="stats"><div class="stat"><b>${c.mins}</b><span>minutes</span></div><div class="stat"><b>${parseFloat(c.speed)}</b><span>km/h</span></div><div class="stat"><b>${c.incl}</b><span>inclinaison</span></div></div>
          <dl class="kv"><div><dt>Intensité</dt><dd>${c.intens}</dd></div><div><dt>Placement</dt><dd>${c.place}</dd></div></dl>
        </div></div>
        <div class="row" style="margin-top:14px"><button type="button" class="btn" data-act="walkstart" data-mins="${c.mins}">${IC.play}Lancer ${c.mins} min</button>${chk}</div></div>`;
    }
    const n = cyc(), total = 4 + n * 2 + 3;
    return `<div class="card" style="${hv(d)}"><div class="cardio-top">${fb('run', 'r-' + d.id)}
        <div style="display:grid;gap:14px">
          <div class="stats"><div class="stat"><b>30 s</b><span>rapide</span></div><div class="stat"><b>90 s</b><span>marche</span></div><div class="stat"><b class="num" id="cycn">${n}</b><span>cycles</span></div></div>
          <dl class="kv"><div><dt>Échauffement</dt><dd>4 min · marche</dd></div><div><dt>Effort rapide</dt><dd>jusqu’à 10 km/h</dd></div><div><dt>Récupération</dt><dd>marche 5–6 km/h</dd></div><div><dt>Retour au calme</dt><dd>3 min</dd></div></dl>
        </div></div>
        <div style="display:grid;gap:8px;margin-top:14px"><div class="itl" id="tl" role="img" aria-label="Déroulé du fractionné">${tlHTML(n)}</div>
          <div class="legend"><span><i style="background:var(--fill)"></i>Échauffement / calme</span><span><i style="background:var(--hue)"></i>Rapide</span><span><i style="background:color-mix(in srgb,var(--hue) 30%,var(--fill))"></i>Récupération</span></div></div>
        <div class="row" style="margin-top:14px"><span class="step" role="group" aria-label="Nombre de cycles"><button type="button" data-act="cyc" data-d="-1" aria-label="Un cycle de moins">−</button><output id="cycv">${n}</output><button type="button" data-act="cyc" data-d="1" aria-label="Un cycle de plus">+</button></span>
          <span class="note" id="cyct">cycles · ${total} min au total</span></div>
        <div class="row" style="margin-top:14px"><button type="button" class="btn" data-act="hiitstart">${IC.play}Lancer le fractionné</button>${chk}</div>
        <p class="note" style="margin-top:12px">10 km/h est une vitesse cible, pas une obligation : commence plus lentement si nécessaire et baisse la vitesse si l’effort devient incontrôlable. Ne tiens pas les poignées.</p></div>`;
  }

  function viewDay(d) {
    const rest = d.type === 'rest', wk = WEEKS[S.week - 1], p = dayProg(d);
    const cover = rest
      ? `<div class="cover gcard art" style="${hc(d)}">${IC.moon}</div>`
      : `<div class="cover gcard art" style="${hc(d)}">${Figs.svg(figKey(d.ex[0][0]), 1)}${ring(p.pct)}</div>`;
    const first = rest ? 0 : Math.max(0, d.ex.findIndex((e) => (W().sets[d.id + ':' + e[0]] || 0) < e[2]));
    let h = `<div class="album" style="${hv(d)}">${cover}
      <div><div class="eb2" style="color:var(--hue)">${rest ? 'Jour de repos' : 'Séance ' + d.n + ' sur 4 · ' + ({ midi: 'Pause du midi', libre: 'Horaire libre', weekend: 'Week-end' }[d.slot] || '')}</div>
      <h1>${d.title}</h1><p class="sub">${d.name} · ${d.dur}</p><p class="meta">${d.focus}</p></div>
      <div class="btnrow" ${rest ? 'style="grid-template-columns:1fr"' : ''}>
        ${rest ? '' : `<button type="button" class="pbtn" data-act="startsession" data-i="${first}">${IC.play}${p.pct > 0 && p.pct < 100 ? 'Reprendre' : p.pct === 100 ? 'Revoir' : 'Commencer'}</button>`}
        <button type="button" class="sbtn" data-act="scrollmeals">Menus du jour</button></div></div>
      <p class="desc">${d.desc}</p>`;
    if (!rest) h += `<div class="callout" style="${hv(d)}"><span class="k">Semaine ${S.week}</span><span>${wk.mus}</span></div>`;
    if (d.warn) h += `<div class="callout warn"><span class="k">À savoir</span><span>${d.warn}</span></div>`;
    if (rest) h += `<div class="callout" style="${hv(d)}"><span class="k">Récupération</span><span>${d.tip}</span></div>`;
    if (!rest) {
      if (d.lunch) h += `<h2 class="sh">Ta pause du midi</h2>${lunchHTML(d)}`;
      h += `<h2 class="sh">Musculation<span class="more num" style="color:var(--dim)">≈ ${d.mus} min · ${setsDone(d)}/${setCount(d)} séries</span></h2>
        <div class="group" style="${hv(d)};${hc(d)}">${d.ex.map((e, i) => {
          const [k, tag, sets, reps, rs] = e, cnt = Math.min(W().sets[d.id + ':' + k] || 0, sets);
          return `<button type="button" class="lrow" data-act="exopen" data-k="${k}" data-d="${d.id}" data-i="${i}" data-done="${cnt >= sets ? 1 : 0}">
            <span class="tn gcard art">${Figs.svg(figKey(k), 1)}</span>
            <span class="tt"><span class="t1">${EX[k].name}${tag ? `<span class="tag">${TAGS[tag]}</span>` : ''}</span><span class="t2 num" style="display:block">${sets} × ${reps} · repos ${fmtRest(rs)}</span></span>
            <span class="rc"><span class="tcount">${cnt}/${sets}</span>${IC.chev}</span></button>`;
        }).join('')}</div>`;
      if (d.option) h += `<p class="note" style="margin-top:10px">${d.option}</p>`;
      if (d.cardio) h += `<h2 class="sh">Cardio<span class="more" style="color:var(--dim)">${d.cardio.kind === 'walk' ? 'Marche inclinée' : 'Fractionné · 15 à 18 min'}</span></h2>${cardioBlock(d)}`;
      else h += `<h2 class="sh">Cardio</h2><p class="note">Aucun cardio aujourd’hui : les jambes ont assez travaillé.</p>`;
    }
    h += `<h2 class="sh" id="meals">Menus du jour<span class="more" style="color:var(--dim)">${d.kcal.split(' · ')[0]}</span></h2>${mealRail(d)}<p class="note">${d.kcal}</p>`;
    return h;
  }

  /* bibliothèque */
  let XF = { q: '', g: 'Tous' };
  const nf = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  function xgrid() {
    const q = nf(XF.q.trim());
    const ks = Object.keys(EX).filter((k) => {
      const x = EX[k];
      if (XF.g !== 'Tous' && x.grp !== XF.g) return false;
      return !q || nf(x.name + ' ' + x.grp + ' ' + x.mus.join(' ')).includes(q);
    });
    if (!ks.length) return '<p class="none" style="grid-column:1/-1">Aucun exercice trouvé.</p>';
    return ks.map((k) => `<button type="button" class="xcard gcard art" style="--hc:var(--h-${GH[EX[k].grp]})" data-act="exopen" data-k="${k}"><div class="xa">${Figs.svg(figKey(k), 1)}</div><div><div class="xg">${EX[k].grp}</div><div class="xn">${EX[k].name}</div></div></button>`).join('');
  }
  function viewEx() {
    return `<div class="lt"><div class="eb">Bibliothèque · ${Object.keys(EX).length} exercices</div><h1>Exercices</h1></div>
      <div class="search">${IC.search}<input id="xq" type="search" placeholder="Rechercher un exercice ou un muscle" aria-label="Rechercher un exercice" value="${esc(XF.q)}" autocomplete="off" autocapitalize="off"></div>
      <div class="pills" role="group" aria-label="Groupe musculaire">${['Tous'].concat(GROUPS).map((g) => `<button type="button" class="pill" data-act="xg" data-g="${g}" aria-pressed="${XF.g === g}">${g}</button>`).join('')}</div>
      <div class="grid" id="xgrid">${xgrid()}</div>`;
  }

  function viewFood() {
    return `<div class="lt"><div class="eb">Base de la prise de masse</div><h1>Nutrition</h1></div>
      <div class="tiles">${MACROS.map((m) => `<div class="tile"><b>${m[0]}</b><span>${m[1]}</span></div>`).join('')}</div>
      <div class="card" style="margin-top:12px"><p class="note">Les calories sont une estimation de départ, à corriger selon ton activité et la tendance de ton poids. Si après 2 semaines le poids moyen ne monte pas, ajoute 150 à 200 kcal par jour. Si la prise est durablement trop rapide ou si le tour de taille augmente nettement, retire environ 100 à 150 kcal.</p>
      <p class="note" style="margin-top:8px">Base des repas : avoine, skyr, œufs, poulet, thon, poisson, riz, pâtes, pommes de terre, légumineuses, légumes, fruits, huile d’olive et oléagineux.</p></div>
      <div class="callout" style="--hue:var(--blue)"><span class="k">Mardi et jeudi, pause du midi</span><span>Petit-déjeuner vers 7 h 30, collation légère vers 11 h (1 h avant la séance), puis repas complet après la séance, vers 13 h 30.</span></div>
      ${DAYS.map((d) => `<h2 class="sh">${d.name}<span class="more" style="color:var(--dim)">${d.title}</span></h2>${mealRail(d)}`).join('')}`;
  }

  function viewTrack() {
    const wp = weekProg();
    const rows = [['depart', 'Départ'], ['1', 'Semaine 1'], ['2', 'Semaine 2'], ['3', 'Semaine 3'], ['4', 'Semaine 4']];
    return `<div class="lt"><div class="eb">Semaine ${S.week}</div><h1>Suivi</h1></div>
      <div class="card plain summary" style="--hue:var(--blue)">${ring(wp.pct, wp.pct + ' %')}<div><h3>${wp.full} séance${wp.full > 1 ? 's' : ''} sur ${wp.n}</h3><p class="note">${wp.done} / ${wp.tot} séries et cardios validés cette semaine.</p></div></div>
      <h2 class="sh">Progression sur 4 semaines</h2>
      <div class="wk">${WEEKS.map((w) => `<button type="button" class="wcard" data-act="week" data-w="${w.w}" aria-current="${w.w === S.week}"><span class="wn">Semaine ${w.w}</span><p>${w.mus}</p><p class="note">${w.car}</p></button>`).join('')}</div>
      <div class="note" style="margin-top:12px">Sur les mouvements principaux, arrête les séries à 1–3 répétitions en réserve. Repos de 2 min sur les exercices lourds, 60 à 90 s sur l’isolation. Technique propre avant toute augmentation de charge.</div>
      <div class="callout" style="--hue:var(--blue)"><span class="k">Faut-il faire du HIIT plus souvent ?</span><span>Non. Une séance de fractionné par semaine suffit largement pour une prise de masse. Évite-le avant la séance jambes : si elles sont lourdes, remplace-le par 15 à 20 min de marche.</span></div>
      <h2 class="sh">Mes mesures</h2>
      <p class="note" style="margin:-4px 0 12px">Pesée : 3 matins par semaine, après les toilettes, avant le petit-déjeuner. Compare les moyennes.</p>
      <div class="sv">${rows.map((r) => `<div class="svr"><h4>${r[1]}</h4><div class="svf">
        <label>Poids moyen (kg)<input id="sv-${r[0]}-p" data-act="suivi" data-r="${r[0]}" data-f="p" inputmode="decimal" autocomplete="off"></label>
        <label>Tour de taille (cm)<input id="sv-${r[0]}-t" data-act="suivi" data-r="${r[0]}" data-f="t" inputmode="decimal" autocomplete="off"></label>
        <label class="w2">Performances / énergie<input id="sv-${r[0]}-n" data-act="suivi" data-r="${r[0]}" data-f="n" autocomplete="off"></label></div></div>`).join('')}</div>
      <p class="sync syncmsg">${syncMsg}</p>
      <p class="safety">Sommeil : viser 7 à 9 heures, avec au moins un jour complet sans musculation. En cas de douleur vive, de vertiges, de douleur thoracique ou d’essoufflement inhabituel, interromps l’effort et demande un avis médical. En cas d’antécédent médical ou de symptôme à l’effort, demande un avis professionnel avant de commencer.</p>`;
  }

  /* ---------- routeur ---------- */
  let view = { id: 'aujourdhui', tab: 'aujourdhui' }, navCount = 0;
  function parse() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h.startsWith('seance-')) { const d = dayById(h.slice(7)); if (d) return { id: 'seance', day: d, tab: 'semaine' }; }
    const t = TABS.find((x) => x[0] === h);
    return t ? { id: t[0], tab: t[0] } : { id: 'aujourdhui', tab: 'aujourdhui' };
  }
  function renderView(scroll) {
    figs.clear();
    let html = '', title = '';
    switch (view.id) {
      case 'semaine': html = viewWeek(); title = 'Semaine ' + S.week; break;
      case 'exercices': html = viewEx(); title = 'Exercices'; break;
      case 'nutrition': html = viewFood(); title = 'Nutrition'; break;
      case 'suivi': html = viewTrack(); title = 'Suivi'; break;
      case 'seance': html = viewDay(view.day); title = view.day.title; break;
      default: html = viewToday(); title = 'Aujourd’hui';
    }
    $('#app').innerHTML = html;
    $('#nbt').textContent = title;
    $('#nbl').innerHTML = view.id === 'seance' ? `<button type="button" class="back" data-act="back">${IC.back}Retour</button>` : '';
    $$('.tb').forEach((t) => (t.dataset.tab === view.tab ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current')));
    if (view.id === 'suivi') Object.keys(S.suivi).forEach((r) => Object.keys(S.suivi[r]).forEach((f) => { const el = $(`#sv-${r}-${f}`); if (el) el.value = S.suivi[r][f]; }));
    $$('.cardio-top .figbox').forEach((b) => mountFig(b, true));
    if (scroll) window.scrollTo(0, 0);
    onScroll();
  }
  function route() { view = parse(); renderView(true); }
  const onScroll = () => $('#nb').classList.toggle('on', window.scrollY > 40);

  /* ---------- figures animées ---------- */
  const figs = new Map();
  let raf = 0, last = 0;
  function mountFig(box, autoplay) {
    if (figs.has(box)) return;
    const key = box.dataset.fig;
    const host = $('.fighost', box);
    host.innerHTML = Figs.svg(key, 0);
    const st = { box, key, svg: $('svg', host), u: 0, phase: 0, playing: !REDUCED && autoplay, loop: box.dataset.loop === '1', period: key === 'run' ? 0.75 : key === 'walk' ? 1.25 : 3.4 };
    figs.set(box, st); syncPlayBtn(st); draw(st);
    if (st.playing) kick();
  }
  const tri = (ph, hold) => { const x = ph < 0.5 ? ph * 2 : (1 - ph) * 2; return Math.min(1, Math.max(0, (x - hold) / (1 - 2 * hold))); };
  function draw(st) { st.svg.innerHTML = Figs.inner(st.key, st.u); }
  function syncPlayBtn(st) { const b = $('.playbtn', st.box); if (!b) return; b.innerHTML = st.playing ? IC.pause : IC.play; b.setAttribute('aria-label', st.playing ? 'Mettre en pause' : 'Lancer l’animation'); }
  function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); } }
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    let any = false;
    figs.forEach((st, box) => {
      if (!box.isConnected) { figs.delete(box); return; }
      if (!st.playing) return;
      any = true;
      st.phase = (st.phase + dt / st.period) % 1;
      st.u = st.loop ? tri(st.phase, 0) : tri(st.phase, 0.12);
      draw(st);
      const sl = $('input[type=range]', st.box); if (sl) sl.value = Math.round(st.u * 100);
    });
    raf = any ? requestAnimationFrame(loop) : 0;
  }

  /* ---------- minuteur (mini-lecteur) ---------- */
  const T = { ph: [], i: 0, left: 0, last: 0, iv: 0, paused: false, title: '' };
  let actx = null;
  function beep(f, d, times) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      for (let k = 0; k < (times || 1); k++) {
        const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + k * 0.22;
        o.frequency.value = f || 880; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + (d || 0.18));
        o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + (d || 0.18) + 0.02);
      }
    } catch (e) {}
    try { navigator.vibrate && navigator.vibrate(times ? 160 : 80); } catch (e) {}
  }
  function showMini(on) { $('#mini').hidden = !on; document.body.classList.toggle('timing', on); }
  function startTimer(phases, title, hue, fk) {
    stopTimer();
    T.ph = phases; T.i = 0; T.left = phases[0].s; T.title = title; T.paused = false; T.last = performance.now();
    const m = $('#mini'); m.style.setProperty('--hue', `var(--${hue})`); $('#mart').style.setProperty('--hc', `var(--h-${hue})`);
    $('#mart').innerHTML = Figs.svg(fk || 'walk', 1);
    showMini(true);
    T.iv = setInterval(tick, 200); renderMini(); beep(660, 0.12);
  }
  function stopTimer() { clearInterval(T.iv); T.iv = 0; showMini(false); }
  function tick() {
    const now = performance.now();
    if (!T.paused) T.left -= (now - T.last) / 1000;
    T.last = now;
    if (T.left <= 0) {
      T.i++;
      if (T.i >= T.ph.length) {
        beep(880, 0.2, 3); clearInterval(T.iv); T.iv = 0;
        $('#mn').textContent = '0:00'; $('#ml').textContent = 'Terminé'; $('#mt').textContent = T.title; $('#mbar').style.width = '100%';
        setTimeout(() => { if (!T.iv) showMini(false); }, 3000); return;
      }
      T.left = T.ph[T.i].s; beep(T.ph[T.i].kind === 'f' ? 988 : 660, 0.18, T.ph[T.i].kind === 'f' ? 2 : 1);
    }
    renderMini();
  }
  function renderMini() {
    const p = T.ph[T.i], nx = T.ph[T.i + 1];
    $('#ml').textContent = p.label;
    $('#mt').textContent = nx ? 'Ensuite : ' + nx.label + ' (' + mmss(nx.s) + ')' : T.title;
    $('#mn').textContent = mmss(T.left);
    $('#mbar').style.width = Math.max(0, Math.min(100, (1 - T.left / p.s) * 100)) + '%';
    $('#mini').classList.toggle('fast', p.kind === 'f');
    const pp = $('#mpp'); pp.innerHTML = T.paused ? IC.play : IC.pause; pp.setAttribute('aria-label', T.paused ? 'Reprendre' : 'Pause');
  }
  function hiitPhases() {
    const n = cyc(), ph = [{ label: 'Échauffement', s: 240, kind: 'w' }];
    for (let i = 1; i <= n; i++) { ph.push({ label: `Effort rapide ${i}/${n}`, s: 30, kind: 'f' }); ph.push({ label: 'Récupération', s: 90, kind: 'r' }); }
    ph.push({ label: 'Retour au calme', s: 180, kind: 'w' });
    return ph;
  }
  let toastT = 0;
  function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (el.hidden = true), 1800); }

  /* ---------- feuilles modales ---------- */
  let SH = null, lastFocus = null;
  function exSheetHTML() {
    const { k, d: did, i } = SH, x = EX[k], day = did ? dayById(did) : null, fk = figKey(k);
    const hue = day ? day.hue : GH[x.grp];
    const days = DAYS.filter((dd) => dd.ex && dd.ex.some((e) => e[0] === k));
    const nav = day ? `<div class="nav2"><button type="button" class="cbtn" data-act="exnav" data-dir="-1" aria-label="Exercice précédent" ${i === 0 ? 'disabled style="opacity:.35"' : ''}>${IC.up}</button><button type="button" class="cbtn" data-act="exnav" data-dir="1" aria-label="Exercice suivant" ${i === day.ex.length - 1 ? 'disabled style="opacity:.35"' : ''}>${IC.down}</button></div>` : '<span></span>';
    return `<div style="--hue:var(--${hue});--hc:var(--h-${hue})">
      <div class="grab">${nav}<button type="button" class="cbtn" data-act="closesheet" aria-label="Fermer" id="sheetclose">${IC.close}</button></div>
      <div class="sheet-b">
        <div class="sart gcard art">${figBox(fk, 'sh-' + k)}</div>
        <div><h2 id="sheettitle">${x.name}</h2>
          <div class="chips">${x.mus.some((m) => m.toLowerCase().startsWith(x.grp.toLowerCase())) ? '' : `<span class="chip">${x.grp}</span>`}${x.mus.map((m) => `<span class="chip">${m}</span>`).join('')}${!day && days.length ? `<span class="chip" style="color:var(--hue)">Au programme : ${days.map((dd) => dd.name).join(', ')}</span>` : ''}</div></div>
        ${day ? `<div id="trk">${trackHTML()}</div>` : ''}
        <ol class="steps">${x.steps.map((s) => `<li><span>${s}</span></li>`).join('')}</ol>
        <p class="err"><b>À éviter.</b> ${x.err}</p>
        <a class="vid" href="${yt(x.q)}" target="_blank" rel="noopener">${IC.play}Voir la vidéo technique</a>
      </div></div>`;
  }
  function trackHTML() {
    const { k, d: did, i } = SH, day = dayById(did), e = day.ex[i], sets = e[2], cnt = Math.min(W().sets[did + ':' + k] || 0, sets);
    const pills = Array.from({ length: sets }, (_, j) => `<button type="button" class="sbig" data-act="setn" data-j="${j + 1}" aria-pressed="${cnt > j}" aria-label="Série ${j + 1} sur ${sets}">${j + 1}</button>`).join('');
    const last = i === day.ex.length - 1;
    const label = cnt < sets ? `Série ${cnt + 1} terminée` : last ? 'Séance terminée' : 'Exercice suivant';
    return `<div class="track"><div class="th"><b class="num">${sets} × ${e[3]}</b><span>repos ${fmtRest(e[4])}</span></div>
      <div class="setrow" role="group" aria-label="Séries réalisées">${pills}</div>
      <button type="button" class="bigbtn ${cnt >= sets ? 'alt' : ''}" data-act="setdone">${label}</button>
      <div class="row"><button type="button" class="restchip" data-act="restnow">${IC.clock}Lancer le repos de ${fmtRest(e[4])}</button></div></div>`;
  }
  function settingsHTML() {
    const th = S.theme || 'auto';
    return `<div style="--hue:var(--blue)"><div class="grab"><span></span><button type="button" class="cbtn" data-act="closesheet" aria-label="Fermer" id="sheetclose">${IC.close}</button></div>
      <div class="sheet-b"><h2 id="sheettitle">Réglages</h2>
      <div class="group">
        <div class="set-row"><div><b>Apparence</b><span>Automatique suit ton téléphone.</span></div></div>
        <div style="padding:0 16px 14px"><div class="seg" role="group" aria-label="Apparence">${[['auto', 'Auto'], ['light', 'Clair'], ['dark', 'Sombre']].map((t) => `<button type="button" data-act="theme" data-t="${t[0]}" aria-pressed="${th === t[0]}">${t[1]}</button>`).join('')}</div></div>
        <div class="set-row"><div><b>Repos automatique</b><span>Lance le minuteur quand tu valides une série.</span></div><button type="button" class="sw" data-act="autorest" aria-pressed="${S.auto}" aria-label="Repos automatique"></button></div>
      </div>
      <p class="sync syncmsg">${syncMsg}</p></div></div>`;
  }
  function openSheet(kind, data) {
    if (SH) closeSheet(true);
    SH = Object.assign({ kind }, data);
    lastFocus = document.activeElement;
    const root = $('#sheetroot');
    root.innerHTML = `<div class="scrim" id="scrim" data-act="closesheet"></div><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheettitle">${kind === 'ex' ? exSheetHTML() : settingsHTML()}</section>`;
    ['app', 'nb', 'tabbar'].forEach((id) => { const el = $('#' + id); if (el) el.setAttribute('inert', ''); });
    document.body.classList.add('sheeted');
    mountSheetFig();
    requestAnimationFrame(() => requestAnimationFrame(() => { const a = $('#scrim'), b = $('#sheet'); if (a && b) { a.classList.add('on'); b.classList.add('on'); const c = $('#sheetclose'); if (c) c.focus({ preventScroll: true }); } }));
  }
  function mountSheetFig() { const b = $('#sheet .figbox'); if (b) mountFig(b, true); }
  function refreshSheet() { const sh = $('#sheet'); if (!sh) return; const top = sh.scrollTop; sh.innerHTML = exSheetHTML(); mountSheetFig(); sh.scrollTop = top; }
  function closeSheet(quick) {
    if (!SH) return;
    const kind = SH.kind; SH = null;
    ['app', 'nb', 'tabbar'].forEach((id) => { const el = $('#' + id); if (el) el.removeAttribute('inert'); });
    document.body.classList.remove('sheeted');
    const root = $('#sheetroot');
    if (quick) root.innerHTML = '';
    else {
      const a = $('#scrim'), b = $('#sheet'); if (a) a.classList.remove('on'); if (b) { b.style.transform = ''; b.classList.remove('on'); }
      setTimeout(() => { if (!SH) root.innerHTML = ''; }, 380);
    }
    if (kind === 'ex' && !quick) renderView(false);
    try { lastFocus && lastFocus.isConnected && lastFocus.focus({ preventScroll: true }); } catch (e) {}
  }
  function setSetCount(nw) {
    const { k, d: did, i } = SH, day = dayById(did), e = day.ex[i], key = did + ':' + k, w = W(), cur = w.sets[key] || 0;
    w.sets[key] = nw; save();
    $('#trk').innerHTML = trackHTML();
    if (nw > cur && nw < e[2] && S.auto) startTimer([{ label: 'Repos', s: e[4], kind: 'r' }], EX[k].name, day.hue, figKey(k));
    else if (nw >= e[2] && nw > cur) { toast('Exercice terminé'); stopTimer(); }
  }
  function gotoEx(i) { const day = dayById(SH.d); if (i < 0 || i >= day.ex.length) return; SH.i = i; SH.k = day.ex[i][0]; refreshSheet(); const sh = $('#sheet'); if (sh) sh.scrollTop = 0; }

  /* ---------- événements ---------- */
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-act]');
    if (!b || b.tagName === 'INPUT') return;
    const act = b.dataset.act, d = view.day;
    if (act === 'back') { if (navCount > 0) history.back(); else location.hash = '#semaine'; }
    else if (act === 'settings') openSheet('settings', {});
    else if (act === 'closesheet') closeSheet();
    else if (act === 'exopen') openSheet('ex', { k: b.dataset.k, d: b.dataset.d || null, i: b.dataset.i != null ? +b.dataset.i : 0 });
    else if (act === 'startsession') { const day = d, i = +b.dataset.i; openSheet('ex', { k: day.ex[i][0], d: day.id, i }); }
    else if (act === 'exnav') gotoEx(SH.i + +b.dataset.dir);
    else if (act === 'setn') { const j = +b.dataset.j, cur = W().sets[SH.d + ':' + SH.k] || 0; setSetCount(cur === j ? j - 1 : j); }
    else if (act === 'setdone') {
      const day = dayById(SH.d), e = day.ex[SH.i], cur = Math.min(W().sets[SH.d + ':' + SH.k] || 0, e[2]);
      if (cur < e[2]) setSetCount(cur + 1); else if (SH.i < day.ex.length - 1) gotoEx(SH.i + 1); else closeSheet();
    }
    else if (act === 'restnow') { const day = dayById(SH.d), e = day.ex[SH.i]; startTimer([{ label: 'Repos', s: e[4], kind: 'r' }], EX[SH.k].name, day.hue, figKey(SH.k)); }
    else if (act === 'theme') { S.theme = b.dataset.t === 'auto' ? null : b.dataset.t; save(); applyTheme(); $$('[data-act=theme]').forEach((x) => x.setAttribute('aria-pressed', x === b)); }
    else if (act === 'autorest') { S.auto = !S.auto; save(); b.setAttribute('aria-pressed', S.auto); }
    else if (act === 'play') { const st = figs.get(b.closest('.figbox')); if (!st) return; st.playing = !st.playing; syncPlayBtn(st); if (st.playing) kick(); }
    else if (act === 'cardiodone') { const w = W(); w.cardio[d.id] = !w.cardio[d.id]; save(); renderView(false); }
    else if (act === 'meal') { const w = W(), key = b.dataset.d + ':' + b.dataset.i; w.meals[key] = !w.meals[key]; save(); b.setAttribute('aria-pressed', !!w.meals[key]); $$(`[data-act=meal][data-d="${b.dataset.d}"][data-i="${b.dataset.i}"]`).forEach((x) => x.setAttribute('aria-pressed', !!w.meals[key])); }
    else if (act === 'week') { S.week = +b.dataset.w; save(); renderView(false); }
    else if (act === 'cyc') {
      const n = Math.min(8, Math.max(3, cyc() + +b.dataset.d)); S.cyc[S.week] = n; save();
      $('#cycv').textContent = n; $('#cycn').textContent = n; $('#tl').innerHTML = tlHTML(n); $('#cyct').textContent = `cycles · ${4 + n * 2 + 3} min au total`;
    }
    else if (act === 'hiitstart') startTimer(hiitPhases(), 'Fractionné', d.hue, 'run');
    else if (act === 'walkstart') startTimer([{ label: 'Marche inclinée', s: +b.dataset.mins * 60, kind: 'w' }], 'Cardio', d.hue, 'walk');
    else if (act === 'scrollmeals') { const el = $('#meals'); if (el) el.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }); }
    else if (act === 'xg') { XF.g = b.dataset.g; $$('.pill').forEach((p) => p.setAttribute('aria-pressed', p === b)); $('#xgrid').innerHTML = xgrid(); }
  });
  let svT = 0;
  document.addEventListener('input', (ev) => {
    const el = ev.target, act = el.dataset && el.dataset.act;
    if (act === 'scrub') {
      const st = figs.get(el.closest('.figbox')); if (!st) return;
      st.playing = false; syncPlayBtn(st); st.u = el.value / 100; draw(st);
    } else if (act === 'suivi') {
      S.suivi[el.dataset.r] = S.suivi[el.dataset.r] || {}; S.suivi[el.dataset.r][el.dataset.f] = el.value;
      clearTimeout(svT); svT = setTimeout(save, 500);
    } else if (el.id === 'xq') { XF.q = el.value; $('#xgrid').innerHTML = xgrid(); }
  });
  $('#mini').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-t]'); if (!b) return; const t = b.dataset.t;
    if (t === 'x') stopTimer();
    else if (t === 'pp') { T.paused = !T.paused; T.last = performance.now(); renderMini(); }
    else { T.left = Math.max(1, T.left + 15); const p = T.ph[T.i]; if (T.left > p.s) p.s = T.left; renderMini(); }
  });
  /* glisser la poignée pour fermer la feuille */
  let drag = null;
  document.addEventListener('pointerdown', (e) => {
    const g = e.target.closest('.grab'); if (!g || e.target.closest('button')) return;
    const sh = $('#sheet'); if (!sh) return;
    drag = { y: e.clientY, dy: 0, sh }; try { g.setPointerCapture(e.pointerId); } catch (x) {} sh.style.transition = 'none';
  });
  document.addEventListener('pointermove', (e) => { if (!drag) return; drag.dy = Math.max(0, e.clientY - drag.y); drag.sh.style.transform = `translateY(${drag.dy}px)`; });
  const endDrag = () => { if (!drag) return; const { sh, dy } = drag; drag = null; sh.style.transition = ''; if (dy > 110) closeSheet(); else sh.style.transform = ''; };
  document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && SH) closeSheet(); });
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('hashchange', () => { navCount++; if (SH) closeSheet(true); route(); });

  /* ---------- démarrage ---------- */
  $('#tabbar').innerHTML = `<div class="tabbar-in">${TABS.map((t) => `<a class="tb" href="#${t[0]}" data-tab="${t[0]}">${t[2]}<span>${t[1]}</span></a>`).join('')}</div>`;
  $('#gear').innerHTML = IC.gear;
  applyTheme(); route();
  initRemote();
  setTimeout(initRemote, 2500);
})();

</script>

</body></html>
