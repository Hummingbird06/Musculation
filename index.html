<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0}
/* Mise en page : barre collante (titre, semaine, thème) + onglets par jour ; une vue à la fois, conçue pour le téléphone en salle. */
[hidden]{display:none!important}
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface2:#e6eaf0; --line:#d3d9e3; --line2:#bcc5d3;
  --fg:#141a26; --dim:#566177; --focus:#1d5fd1;
  --blue:#1d5fd1; --green:#177a3b; --orange:#b45a00; --pink:#c0204c; --rest:#566177; --teal:#0e7690;
  --hue:var(--blue);
  --shadow:0 1px 2px rgba(20,26,38,.06),0 6px 20px rgba(20,26,38,.06);
  --font-d:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-b:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1119; --surface:#161c28; --surface2:#1f2736; --line:#2a3447; --line2:#3b475e;
  --fg:#eef1f6; --dim:#9aa7bd; --focus:#7db0ff;
  --blue:#6aa5ff; --green:#4fd17f; --orange:#ffa94a; --pink:#ff7195; --rest:#9aa7bd; --teal:#62d4ef;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1119; --surface:#161c28; --surface2:#1f2736; --line:#2a3447; --line2:#3b475e;
  --fg:#eef1f6; --dim:#9aa7bd; --focus:#7db0ff;
  --blue:#6aa5ff; --green:#4fd17f; --orange:#ffa94a; --pink:#ff7195; --rest:#9aa7bd; --teal:#62d4ef;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,p,ol,ul,figure{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:880px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* ---- barre du haut ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.top-in{max-width:880px;margin:0 auto}
.bar{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--font-d);font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand small{font-family:var(--font-b);font-weight:500;font-size:13px;letter-spacing:0;text-transform:none;color:var(--dim);margin-left:6px}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;min-width:40px;height:34px;font-weight:600;font-size:14px;color:var(--dim);padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.iconbtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 0 0;margin:0 -4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:54px;text-align:center;text-decoration:none;padding:8px 10px 10px;border-bottom:3px solid transparent;color:var(--dim);font-weight:600;font-size:14.5px;position:relative;white-space:nowrap}
.tab .st{display:block;font-size:11px;font-weight:500;height:14px;line-height:14px;margin-top:1px}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--hue)}
.tab.rest{font-weight:500}
.tab .ok{color:var(--green)}

/* ---- vues ---- */
main{padding-top:26px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
h1.big{font-family:var(--font-d);font-weight:700;font-size:clamp(44px,9vw,72px);line-height:.95;text-transform:uppercase;letter-spacing:.005em;text-wrap:balance;margin-top:6px}
h2.title{font-family:var(--font-d);font-weight:700;font-size:clamp(38px,8vw,60px);line-height:.98;text-transform:uppercase;text-wrap:balance;margin-top:6px}
h3.sec{font-family:var(--font-d);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.lead{color:var(--dim);font-size:17.5px;max-width:62ch;margin-top:12px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:34px 0 12px;flex-wrap:wrap}
.sec-head .meta{color:var(--dim);font-size:14.5px}
.pill{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;font-weight:600;font-size:14px;background:color-mix(in srgb,var(--hue) 15%,transparent);color:var(--hue)}
.dayhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:20px;color:var(--fg);font-size:15px}
.facts b{font-family:var(--font-d);font-size:22px;font-weight:700;margin-right:5px;letter-spacing:.01em}

.callout{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:4px;font-size:15px}
.callout .k{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--hue)}
.callout.warn{border-color:color-mix(in srgb,var(--orange) 55%,var(--line))}
.callout.warn .k{color:var(--orange)}

/* ---- semaine ---- */
.agenda{display:grid;gap:8px;margin-top:22px;padding:0;list-style:none}
.arow{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;min-height:68px}
.arow:hover{border-color:var(--line2)}
.arow .dn{font-family:var(--font-d);font-weight:700;text-transform:uppercase;line-height:1;text-align:center;background:color-mix(in srgb,var(--hue) 14%,transparent);color:var(--hue);border-radius:10px;padding:8px 0 7px}
.arow .dn b{display:block;font-size:24px}
.arow .dn span{font-size:13px;letter-spacing:.1em}
.arow.rest .dn{background:var(--surface2);color:var(--dim)}
.arow .t{font-weight:600;font-size:16.5px;line-height:1.25}
.arow .s{color:var(--dim);font-size:14px;margin-top:2px}
.arow .r{text-align:right;font-size:13px;color:var(--dim);display:grid;gap:5px;justify-items:end}
.arow.today{border-color:var(--hue);box-shadow:0 0 0 1px var(--hue) inset}
.chip-today{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--hue);color:var(--bg);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:2px}
.meter{width:76px;height:6px;border-radius:999px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--hue);border-radius:999px;transition:width .25s}

/* ---- exercices ---- */
.exlist{display:grid;gap:10px;padding:0;list-style:none}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ex[data-done="1"] .exname{color:var(--dim)}
.exhead{width:100%;border:0;background:transparent;text-align:left;display:grid;grid-template-columns:76px 1fr 22px;gap:12px;align-items:center;padding:10px 14px 10px 10px}
.thumb{background:var(--surface2);border-radius:10px;padding:3px;aspect-ratio:4/3;display:block}
.exmain{min-width:0}
.exname{font-weight:600;font-size:17px;line-height:1.25;display:block;text-wrap:balance}
.exmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:5px;color:var(--dim);font-size:14px}
.exmeta .sr{color:var(--fg);font-weight:600}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--hue) 16%,transparent);color:var(--hue)}
.chev{width:20px;height:20px;stroke:var(--dim);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.exhead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.sets{display:flex;align-items:center;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.sets .lbl{font-size:13px;color:var(--dim);margin-right:4px;min-width:48px}
.set{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface);font-weight:700;font-size:16px;display:grid;place-items:center;color:var(--dim);font-variant-numeric:tabular-nums}
.set[aria-pressed="true"]{background:var(--hue);border-color:var(--hue);color:var(--bg)}
.restbtn{margin-left:auto;height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line2);background:transparent;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:6px}
.restbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.exbody{border-top:1px solid var(--line);padding:16px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.figbox{background:var(--surface2);border-radius:14px;padding:8px 8px 10px}
.figbox .figsvg{max-height:260px}
.figctl{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;margin-top:4px}
.playbtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);display:grid;place-items:center}
.playbtn svg{width:16px;height:16px;fill:var(--fg)}
.scr{min-width:0}
.scr input{width:100%;accent-color:var(--hue);height:28px;margin:0}
.scr .ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);gap:8px}
.exinfo{display:grid;gap:12px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:500;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--dim)}
.steps{display:grid;gap:8px;padding-left:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:15.5px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:color-mix(in srgb,var(--hue) 16%,transparent);color:var(--hue);font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:1px}
.err{font-size:14.5px;color:var(--dim);border-left:3px solid var(--line2);padding-left:12px}
.err b{color:var(--fg)}
.vid{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;background:var(--hue);color:var(--bg);font-weight:700;text-decoration:none;justify-self:start;font-size:15px}
.vid svg{width:14px;height:14px;fill:currentColor}
@media(min-width:700px){
  .exbody{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}
  .exhead{grid-template-columns:92px 1fr 22px}
}

/* ---- cardio ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:16px}
.cardio-top{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:700px){.cardio-top{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--font-d);font-size:30px;line-height:1;font-weight:700}
.stat span{font-size:12.5px;color:var(--dim)}
.kv{display:grid;gap:6px;font-size:15px}
.kv div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.kv div:last-child{border:0;padding:0}
.kv dt{color:var(--dim)}
.kv dd{margin:0;font-weight:600;text-align:right}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--hue);color:var(--bg);font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:transparent;border:1.5px solid var(--line2);color:var(--fg)}
.btn svg{width:15px;height:15px;fill:currentColor}
.check{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 14px 0 10px;border-radius:999px;border:1.5px solid var(--line2);background:transparent;font-weight:600;font-size:15px}
.check i{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center}
.check i svg{width:15px;height:15px;stroke:var(--bg);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check[aria-pressed="true"] i{background:var(--hue);border-color:var(--hue)}
.check[aria-pressed="true"] i svg{opacity:1}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line2);background:transparent;font-size:20px;line-height:1}
.step output{min-width:2ch;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.tl{display:flex;height:44px;border-radius:10px;overflow:hidden;gap:2px;background:var(--bg)}
.tl span{display:block;min-width:2px}
.tl .w{background:var(--surface2)}
.tl .f{background:var(--hue)}
.tl .r{background:color-mix(in srgb,var(--hue) 30%,var(--surface2))}
.tl .c{background:var(--surface2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---- repas ---- */
.meals{display:grid;gap:0;padding:0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.meal{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 14px;border-bottom:1px solid var(--line);align-items:start}
.meal:last-child{border:0}
.meal .tick{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line2);background:transparent;display:grid;place-items:center}
.meal .tick svg{width:20px;height:20px;stroke:var(--bg);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.meal .tick[aria-pressed="true"]{background:var(--hue);border-color:var(--hue)}
.meal .tick[aria-pressed="true"] svg{opacity:1}
.meal h4{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}
.meal p{margin-top:3px;font-size:16px}
.note{color:var(--dim);font-size:14.5px;margin-top:10px}

/* ---- repères ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile b{display:block;font-family:var(--font-d);font-size:32px;font-weight:700;line-height:1}
.tile span{display:block;color:var(--dim);font-size:14px;margin-top:6px}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}
tr.cur td{background:color-mix(in srgb,var(--blue) 10%,transparent)}
tr.cur td:first-child{font-weight:700}
.wbtn{border:0;background:transparent;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
td input{width:100%;min-width:90px;height:42px;border-radius:10px;border:1.5px solid var(--line2);background:var(--bg);color:var(--fg);font:inherit;padding:0 10px}
td input.wide{min-width:200px}
.sync{font-size:13px;color:var(--dim);margin-top:10px}
.safety{font-size:14px;color:var(--dim);margin-top:30px;border-top:1px solid var(--line);padding-top:16px;max-width:70ch}

/* ---- minuteur ---- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.dock-in{max-width:620px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:20px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;box-shadow:var(--shadow);pointer-events:auto}
.dock-lbl{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.dock-t{font-family:var(--font-d);font-weight:700;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.dock-next{font-size:13px;opacity:.75}
.dock-btns{display:flex;gap:6px;align-items:center}
.dock-btns button{height:44px;min-width:44px;padding:0 12px;border-radius:12px;border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:700;font-size:14px}
.dock-bar{grid-column:1/-1;height:5px;border-radius:99px;background:color-mix(in srgb,var(--bg) 22%,transparent);overflow:hidden}
.dock-bar i{display:block;height:100%;background:var(--bg);width:0;transition:width .25s linear}
.dock.fast .dock-in{background:var(--hue);color:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14.5px;z-index:50}

@media(max-width:520px){
  .brand small{display:none}
  .arow{grid-template-columns:54px 1fr;}
  .arow .r{grid-column:1/-1;flex-direction:row;display:flex;justify-content:space-between;align-items:center;text-align:left}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.figsvg{display:block;width:100%;height:auto}
.figsvg .fl{stroke:var(--line2);stroke-width:2;stroke-linecap:round}
.figsvg .pr{stroke:var(--dim);stroke-width:2.2;fill:none;stroke-linecap:round}
.figsvg .pad{fill:var(--surface2);stroke:var(--dim);stroke-width:1.6}
.figsvg .padl{stroke:var(--dim);stroke-width:6;stroke-linecap:round;opacity:.55}
.figsvg .padf{fill:var(--surface2);stroke:var(--dim);stroke-width:5;stroke-linecap:round;opacity:.6}
.figsvg .belt{stroke:var(--dim);stroke-width:3;stroke-linecap:round}
.figsvg .bd{stroke:var(--fg);stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round;fill:none}
.figsvg .bd.tr{stroke-width:6.5}
.figsvg .bd.far{stroke:var(--dim);opacity:.6}
.figsvg .hd{fill:var(--surface);stroke:var(--fg);stroke-width:3.2}
.figsvg .pl{fill:color-mix(in srgb,var(--hue) 22%,transparent);stroke:var(--hue);stroke-width:3}
.figsvg .dot{fill:var(--hue)}
.figsvg .db{fill:var(--hue)}
.figsvg .dbr{fill:var(--hue)}
.figsvg .cb{stroke:var(--hue);stroke-width:1.4;opacity:.85;fill:none}

<script>
/* ============ Moteur d'illustrations : bonhomme articulé (cinématique directe + IK) ============ */
(function () {
  const L = { T: 34, th: 29, sh: 28, ua: 19, fa: 18, ft: 9, hd: 15 };
  const rad = (a) => (a * Math.PI) / 180;
  const dn = (a) => [Math.sin(rad(a)), Math.cos(rad(a))]; // angle depuis "vers le bas", + = vers l'avant (x+)
  const add = (p, v, l) => [p[0] + v[0] * l, p[1] + v[1] * l];
  const f1 = (n) => n.toFixed(1);

  function ik(A, T, l1, l2, s) {
    const dx = T[0] - A[0], dy = T[1] - A[1];
    const d0 = Math.hypot(dx, dy) || 0.001;
    const d = Math.min(Math.max(d0, Math.abs(l1 - l2) + 0.5), l1 + l2 - 0.05);
    const ux = dx / d0, uy = dy / d0;
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(l1 * l1 - a * a, 0));
    return [A[0] + ux * a - s * uy * h, A[1] + uy * a + s * ux * h];
  }

  /* ---------- vue de profil ---------- */
  function solveS(p) {
    const J = {};
    const t = p.t || 0;
    let hip, kn, an;
    if (p.lk) { hip = p.hip; an = p.lk; kn = ik(hip, an, L.th, L.sh, p.ls || 1); }
    else if (p.an) { an = p.an; kn = add(an, dn(p.sh || 0), -L.sh); hip = add(kn, dn(p.th || 0), -L.th); }
    else { hip = p.hip; kn = add(hip, dn(p.th || 0), L.th); an = add(kn, dn(p.sh || 0), L.sh); }
    const sho = add(hip, [Math.sin(rad(t)), -Math.cos(rad(t))], L.T);
    const ha = t + (p.nk || 0);
    const hd = add(sho, [Math.sin(rad(ha)), -Math.cos(rad(ha))], L.hd);
    let el, wr;
    if (p.ak) {
      const tg = p.ak === 'head' ? [hd[0] + (p.ako ? p.ako[0] : 0), hd[1] + (p.ako ? p.ako[1] : 0)] : p.ak;
      wr = tg; el = ik(sho, tg, L.ua, L.fa, p.as || 1);
    } else { el = add(sho, dn(p.ua || 0), L.ua); wr = add(el, dn(p.fa || 0), L.fa); }
    const to = add(an, dn(p.ft == null ? 90 : p.ft), L.ft);
    Object.assign(J, { hip, kn, an, to, sho, hd, el, wr });
    if (p.th2 != null) {
      J.kn2 = add(hip, dn(p.th2), L.th); J.an2 = add(J.kn2, dn(p.sh2), L.sh); J.to2 = add(J.an2, dn(p.ft2 == null ? 90 : p.ft2), L.ft);
    }
    if (p.ua2 != null) { J.el2 = add(sho, dn(p.ua2), L.ua); J.wr2 = add(J.el2, dn(p.fa2), L.fa); }
    return J;
  }

  /* ---------- vue de face ---------- */
  function solveF(p) {
    const cx = p.cx || 120, hy = p.hy || 69, b = p.b || 0, cb = Math.cos(rad(b));
    const shy = hy - L.T * cb;
    const hdy = shy - L.hd * cb + (b ? 8 * Math.sin(rad(b)) * 0.5 : 0);
    const J = { cx, hy, shy, hdy, sx: 15 };
    J.shR = [cx + 15, shy]; J.shL = [cx - 15, shy];
    const arm = (sgn) => {
      const s0 = [cx + sgn * 15, shy];
      const e = [s0[0] + sgn * L.ua * Math.sin(rad(p.ua)), s0[1] + L.ua * Math.cos(rad(p.ua))];
      const w = [e[0] + sgn * L.fa * Math.sin(rad(p.fa)), e[1] + L.fa * Math.cos(rad(p.fa))];
      return [s0, e, w];
    };
    J.aR = arm(1); J.aL = arm(-1);
    const leg = (sgn) => [[cx + sgn * 7, hy], [cx + sgn * 10, hy + L.th], [cx + sgn * 12, hy + L.th + L.sh]];
    J.lR = leg(1); J.lL = leg(-1);
    J.wrR = J.aR[2]; J.wrL = J.aL[2];
    return J;
  }

  /* ---------- helpers SVG ---------- */
  const ln = (a, b, c = 'pr', x = '') => `<line class="${c}" x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" ${x}/>`;
  const ci = (c, r, cl = 'pr') => `<circle class="${cl}" cx="${f1(c[0])}" cy="${f1(c[1])}" r="${r}"/>`;
  const poly = (pts, cl) => `<polyline class="${cl}" points="${pts.map((q) => f1(q[0]) + ',' + f1(q[1])).join(' ')}"/>`;
  const rect = (x, y, w, h, cl = 'pad', r = 2) => `<rect class="${cl}" x="${f1(x)}" y="${f1(y)}" width="${w}" height="${h}" rx="${r}"/>`;
  const FL = ln([10, 130], [230, 130], 'fl');
  const plate = (c, r = 8) => ci(c, r, 'pl') + ci(c, 1.8, 'dot');
  const dumb = (c) => ci(c, 5.5, 'db');
  const bench = (x1, x2, y) => rect(x1, y, x2 - x1, 5, 'pad') + ln([x1 + 6, y + 5], [x1 + 6, 130]) + ln([x2 - 6, y + 5], [x2 - 6, 130]);
  const unit = (a, b) => { const d = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1; return [(b[0] - a[0]) / d, (b[1] - a[1]) / d]; };

  /* ---------- dessin ---------- */
  function drawS(J) {
    let s = '';
    if (J.kn2) s += poly([J.hip, J.kn2, J.an2, J.to2], 'bd far');
    if (J.el2) s += poly([J.sho, J.el2, J.wr2], 'bd far');
    s += ln(J.hip, J.sho, 'bd tr');
    s += poly([J.hip, J.kn, J.an, J.to], 'bd');
    s += ln(J.sho, J.hd, 'bd');
    s += `<circle class="hd" cx="${f1(J.hd[0])}" cy="${f1(J.hd[1])}" r="8"/>`;
    s += poly([J.sho, J.el, J.wr], 'bd');
    return s;
  }
  function drawF(J) {
    let s = '';
    s += ln([J.cx, J.hy], [J.cx, J.shy], 'bd tr');
    s += ln(J.shL, J.shR, 'bd tr');
    s += ln([J.cx - 7, J.hy], [J.cx + 7, J.hy], 'bd tr');
    s += poly(J.lR, 'bd') + poly(J.lL, 'bd');
    s += ln([J.cx, J.shy], [J.cx, J.hdy], 'bd');
    s += `<circle class="hd" cx="${f1(J.cx)}" cy="${f1(J.hdy)}" r="8"/>`;
    s += poly(J.aR, 'bd') + poly(J.aL, 'bd');
    return s;
  }

  const F = {}; // exercices
  const side = (a, b, bg, fg, extra) => Object.assign({ v: 's', a, b, bg, fg }, extra || {});
  const front = (a, b, bg, fg, extra) => Object.assign({ v: 'f', a, b, bg, fg }, extra || {});
  const none = () => '';

  /* Développé couché */
  F.dc = side(
    { hip: [130, 100], t: -90, th: 95, sh: 3, ua: 180, fa: 180 },
    { hip: [130, 100], t: -90, th: 95, sh: 3, ua: 75, fa: 180 },
    () => FL + bench(66, 146, 104) + ln([72, 130], [72, 58]) + ln([72, 66], [84, 66]),
    (J) => plate(J.wr, 8),
    { la: 'Bras tendus', lb: 'Barre à la poitrine' }
  );
  /* Développé incliné haltères */
  F.di = side(
    { hip: [100, 95], t: -55, th: 88, sh: 0, ua: 168, fa: 172 },
    { hip: [100, 95], t: -55, th: 88, sh: 0, ua: 60, fa: 175 },
    (J) => {
      const u = unit(J.hip, J.sho), n = [-u[1] * -1, u[0] * -1];
      const nn = [-0.574, 0.819];
      const a = add(J.hip, nn, 7), b = add(J.sho, nn, 7);
      return FL + ln(add(a, u, -4), add(b, u, 14), 'padl') + ln([a[0] - 2, a[1] + 1], [126, a[1] + 7], 'padl') + ln([a[0] + 6, a[1] + 8], [a[0] + 6, 130]) + ln([120, a[1] + 7], [120, 130]);
    },
    (J) => dumb(J.wr),
    { la: 'Bras tendus', lb: 'Haltères en bas' }
  );
  /* Écartés poulie */
  F.ec = front(
    { ua: 82, fa: 100 },
    { ua: 18, fa: -70 },
    (J) => FL + ln([J.cx - 108, -16], [J.cx - 108, 130]) + ln([J.cx + 108, -16], [J.cx + 108, 130]) + ci([J.cx - 108, 6], 4) + ci([J.cx + 108, 6], 4),
    (J) => ln([J.cx - 108, 6], J.wrL, 'cb') + ln([J.cx + 108, 6], J.wrR, 'cb') + dumb(J.wrL) + dumb(J.wrR),
    { la: 'Bras ouverts', lb: 'Mains jointes' }
  );
  /* Pec deck */
  F.pd = front(
    { ua: 82, fa: 185 },
    { ua: 25, fa: 190 },
    (J) => FL + rect(J.cx - 12, J.shy - 10, 24, 80, 'pad', 4) + rect(J.cx - 22, 100, 44, 6, 'pad') + ln([J.cx, 106], [J.cx, 130]),
    (J) => {
      const pad = (a) => ln(a[1], a[2], 'padf');
      return pad(J.aR) + pad(J.aL) + ci(J.aR[1], 3, 'dot') + ci(J.aL[1], 3, 'dot');
    },
    { la: 'Coudes ouverts', lb: 'Bras joints' }
  );
  /* Extension triceps corde */
  F.tc = side(
    { hip: [105, 69], t: 6, th: 0, sh: 0, ua: 2, fa: 100 },
    { hip: [105, 69], t: 6, th: 0, sh: 0, ua: 2, fa: 8 },
    () => FL + ln([152, -16], [152, 130]) + ln([133, -16], [133, 8], 'cb') + ci([133, 8], 4),
    (J) => ln([133, 8], J.wr, 'cb') + ci(J.wr, 3.2, 'db'),
    { la: 'Coudes à 90°', lb: 'Bras tendus' }
  );
  /* Extension triceps au-dessus de la tête */
  F.to = side(
    { hip: [120, 69], t: 0, th: 0, sh: 0, ua: 160, fa: -70 },
    { hip: [120, 69], t: 0, th: 0, sh: 0, ua: 178, fa: 178 },
    () => FL,
    (J) => dumb(J.wr),
    { la: 'Haltère derrière la tête', lb: 'Bras tendus' }
  );
  /* Tirage vertical */
  F.tv = side(
    { hip: [95, 97], t: -8, th: 88, sh: 3, ua: 172, fa: 176 },
    { hip: [95, 97], t: -14, th: 88, sh: 3, ua: 15, fa: 168 },
    (J) => FL + ln([60, -16], [150, -16]) + rect(78, 102, 36, 5, 'pad') + ln([96, 107], [96, 130]) + rect(108, 85, 28, 6, 'pad') + ln([122, 91], [122, 98]),
    (J) => ln([J.wr[0], -16], J.wr, 'cb') + ci([J.wr[0], -16], 3.5) + ci(J.wr, 3.5, 'db'),
    { la: 'Bras tendus', lb: 'Barre à la poitrine' }
  );

    if (!rest) h += `<div class="callout" style="${hueOf(d)}"><span class="k">Semaine ${S.week}</span><span>${wk.mus}</span></div>`;
    if (d.warn) h += `<div class="callout warn"><span class="k">À savoir</span><span>${d.warn}</span></div>`;
    if (rest) h += `<div class="callout" style="${hueOf(d)}"><span class="k">Récupération</span><span>${d.tip}</span></div>`;
    if (!rest) {
      h += `<div class="sec-head"><h3 class="sec">Musculation</h3><span class="meta num" id="setmeta">≈ ${d.mus} min · ${setsDone(d)}/${setCount(d)} séries</span></div>
        <ul class="exlist" style="${hueOf(d)}">${d.ex.map((e, i) => exItem(d, e, i + 1)).join('')}</ul>
        <div class="row" style="margin-top:12px"><button type="button" class="check" data-act="autorest" aria-pressed="${S.auto}" style="--hue:var(--blue)"><i>${IC.check}</i>Lancer le repos en cochant une série</button></div>`;
      if (d.option) h += `<p class="note">${d.option}</p>`;
      if (d.cardio) h += `<div class="sec-head"><h3 class="sec">Cardio</h3><span class="meta">${d.cardio.kind === 'walk' ? 'Marche inclinée · après la musculation' : 'Fractionné sur tapis · 15 à 18 min'}</span></div>${cardioBlock(d)}`;
      else h += `<div class="sec-head"><h3 class="sec">Cardio</h3><span class="meta">Aucun aujourd’hui</span></div><p class="note" style="margin-top:0">Pas de cardio le vendredi : les jambes ont assez travaillé.</p>`;
    }
    h += `<div class="sec-head"><h3 class="sec">Menus du jour</h3><span class="meta">${d.kcal}</span></div>
      <ul class="meals" style="${hueOf(d)}">${d.meals.map((m, i) => `<li class="meal"><button type="button" class="tick" data-act="meal" data-i="${i}" aria-pressed="${!!W().meals[d.id + ':' + i]}" aria-label="Repas pris : ${m[0]}">${IC.check}</button><div><h4>${m[0]}</h4><p>${m[1]}</p></div></li>`).join('')}</ul>`;
    return h;
  }
  const setsDone = (d) => d.ex.reduce((a, e) => a + Math.min(W().sets[d.id + ':' + e[0]] || 0, e[2]), 0);

  function viewReperes() {
    const sv = [['depart', 'Départ'], ['1', 'Semaine 1'], ['2', 'Semaine 2'], ['3', 'Semaine 3'], ['4', 'Semaine 4']];
    return `<p class="eyebrow">Repères</p><h2 class="title">Nutrition,<br>progression, suivi</h2>
      <div class="sec-head"><h3 class="sec">Nutrition</h3></div>
      <div class="tiles">${MACROS.map((m) => `<div class="tile"><b>${m[0]}</b><span>${m[1]}</span></div>`).join('')}</div>
      <p class="note">Les calories sont une estimation de départ, à corriger selon ton activité et la tendance de ton poids. Si après 2 semaines le poids moyen ne monte pas, ajoute 150 à 200 kcal par jour. Si la prise est durablement trop rapide ou si le tour de taille augmente nettement, retire environ 100 à 150 kcal. Base des repas : avoine, skyr, œufs, poulet, thon, poisson, riz, pâtes, pommes de terre, légumineuses, légumes, fruits, huile d’olive et oléagineux.</p>
      <div class="sec-head"><h3 class="sec">Progression sur 4 semaines</h3></div>
      <div class="tblwrap"><table><thead><tr><th>Semaine</th><th>Musculation</th><th>Cardio</th></tr></thead><tbody>
        ${WEEKS.map((w) => `<tr class="${w.w === S.week ? 'cur' : ''}"><td><button type="button" class="wbtn" data-act="week" data-w="${w.w}" aria-label="Passer à la semaine ${w.w}">${w.w}</button></td><td>${w.mus}</td><td>${w.car}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="note">Sur les mouvements principaux, arrête les séries à 1–3 répétitions en réserve. Repos de 2 min sur les exercices lourds, 60 à 90 s sur l’isolation. Technique propre avant toute augmentation de charge.</p>
      <div class="callout" style="--hue:var(--blue)"><span class="k">Faut-il faire du HIIT plus souvent ?</span><span>Non. Pour une prise de masse, une séance de fractionné par semaine suffit largement : les deux autres séances de cardio sont de la marche inclinée. Évite le fractionné après la séance jambes. Si les jambes sont lourdes le mercredi ou si la récupération se dégrade, remplace-le par 15 à 20 min de marche.</span></div>
      <div class="sec-head"><h3 class="sec">Suivi</h3><span class="meta">Pesée : 3 matins par semaine, après les toilettes, avant le petit-déjeuner. Compare les moyennes.</span></div>
      <div class="tblwrap"><table><thead><tr><th>Semaine</th><th>Poids moyen (kg)</th><th>Tour de taille (cm)</th><th>Performances / énergie</th></tr></thead><tbody>
        ${sv.map((r) => `<tr><td>${r[1]}</td><td><input id="sv-${r[0]}-p" data-act="suivi" data-r="${r[0]}" data-f="p" inputmode="decimal" aria-label="Poids moyen, ${r[1]}"></td><td><input id="sv-${r[0]}-t" data-act="suivi" data-r="${r[0]}" data-f="t" inputmode="decimal" aria-label="Tour de taille, ${r[1]}"></td><td><input class="wide" id="sv-${r[0]}-n" data-act="suivi" data-r="${r[0]}" data-f="n" aria-label="Performances et énergie, ${r[1]}"></td></tr>`).join('')}
      </tbody></table></div>
      <p class="sync" id="sync">Ta progression est enregistrée sur cet appareil.</p>
      <p class="safety">Sommeil : viser 7 à 9 heures, avec au moins un jour complet sans musculation. En cas de douleur vive, de vertiges, de douleur thoracique ou d’essoufflement inhabituel, interromps l’effort et demande un avis médical. En cas d’antécédent médical ou de symptôme à l’effort, demande un avis professionnel avant de commencer.</p>`;
  }

  /* ---------- routeur ---------- */
  let curView = 'semaine';
  const IDS = ['semaine'].concat(DAYS.map((d) => d.id), ['reperes']);
  function renderView(scroll) {
    stopFigs();
    const d = DAYS.find((x) => x.id === curView);
    $('#app').innerHTML = curView === 'semaine' ? viewSemaine() : curView === 'reperes' ? viewReperes() : viewDay(d);
    if (curView === 'reperes') {
      Object.keys(S.suivi).forEach((r) => Object.keys(S.suivi[r]).forEach((f) => { const el = $(`#sv-${r}-${f}`); if (el) el.value = S.suivi[r][f]; }));
      if (remote) setSync('Ta progression est aussi enregistrée sur ton compte : tu la retrouves sur ton téléphone et ton ordinateur.');
    }
    // figures des cartes cardio : visibles d'emblée
    $$('.cardio-top .figbox').forEach((b) => mountFig(b, true));
    markTabs(scroll);
    if (scroll) window.scrollTo(0, 0);
  }
  function route() {
    const id = location.hash.slice(1);
    curView = IDS.includes(id) ? id : 'semaine';
    renderView(true);
  }
  function renderAll() { renderTop(); renderView(false); }

  /* ---------- figures animées ---------- */
  const figs = new Map();
  let raf = 0, last = 0;
  function mountFig(box, autoplay) {
    if (figs.has(box)) return;
    const key = box.dataset.fig, m = Figs.meta(key);
    const host = $('.fighost', box);
    host.innerHTML = Figs.svg(key, 0);
    const st = { box, key, svg: $('svg', host), u: 0, phase: 0, playing: !REDUCED && autoplay, loop: box.dataset.loop === '1', period: key === 'run' ? 0.75 : key === 'walk' ? 1.25 : 3.4 };
    figs.set(box, st); syncPlayBtn(st); draw(st);
    if (st.playing) kick();
  }
  const tri = (ph, hold) => { // 0..1..0 avec petite pause aux extrémités
    let x = ph < 0.5 ? ph * 2 : (1 - ph) * 2;
    return Math.min(1, Math.max(0, (x - hold) / (1 - 2 * hold)));
  };
  function draw(st) { st.svg.innerHTML = Figs.inner(st.key, st.u); }
  function syncPlayBtn(st) { const b = $('.playbtn', st.box); b.innerHTML = st.playing ? IC.pause : IC.play; b.setAttribute('aria-label', st.playing ? 'Mettre en pause' : 'Lancer l’animation'); }
  function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); } }
  function loop(now) {
    const dt = (now - last) / 1000; last = now;
    let any = false;
    figs.forEach((st) => {
      if (!st.playing) return; any = true;
      st.phase = (st.phase + dt / st.period) % 1;
      st.u = st.loop ? tri(st.phase, 0) : tri(st.phase, 0.12);
      draw(st);
      const sl = $('input[type=range]', st.box); if (sl) sl.value = Math.round(st.u * 100);
    });
    raf = any ? requestAnimationFrame(loop) : 0;
  }
  function stopFigs() { figs.clear(); if (raf) cancelAnimationFrame(raf); raf = 0; }

  /* ---------- minuteur ---------- */
  const T = { ph: [], i: 0, left: 0, last: 0, iv: 0, paused: false, title: '', total: 0 };
  let actx = null;
  function beep(f, d, times) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      for (let k = 0; k < (times || 1); k++) {
        const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + k * 0.22;
        o.frequency.value = f || 880; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + (d || 0.18));
        o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + (d || 0.18) + 0.02);
      }
    } catch (e) {}
    try { navigator.vibrate && navigator.vibrate(times ? 160 : 80); } catch (e) {}
  }
  function startTimer(phases, title, hueVar) {
    stopTimer();
    T.ph = phases; T.i = 0; T.left = phases[0].s; T.title = title; T.paused = false; T.last = performance.now();
    $('#dock').style.setProperty('--hue', hueVar || 'var(--blue)');
    $('#dock').hidden = false;
    T.iv = setInterval(tick, 200); renderDock(); beep(660, 0.12);
  }
  function stopTimer() { clearInterval(T.iv); T.iv = 0; const d = $('#dock'); if (d) d.hidden = true; }
  function tick() {
    const now = performance.now();
    if (!T.paused) T.left -= (now - T.last) / 1000;
    T.last = now;
    if (T.left <= 0) {
      T.i++;
      if (T.i >= T.ph.length) { beep(880, 0.2, 3); clearInterval(T.iv); T.iv = 0; $('#dt').textContent = '0:00'; $('#dl').textContent = 'Terminé'; $('#dnx').textContent = ''; $('#db').style.width = '100%'; setTimeout(() => { if (!T.iv) $('#dock').hidden = true; }, 2500); return; }
      T.left = T.ph[T.i].s; beep(T.ph[T.i].kind === 'f' ? 988 : 660, 0.18, T.ph[T.i].kind === 'f' ? 2 : 1);
    }
    renderDock();
  }
  function renderDock() {
    const p = T.ph[T.i], nx = T.ph[T.i + 1];
    $('#dl').textContent = (T.title ? T.title + ' · ' : '') + p.label;
    $('#dt').textContent = mmss(T.left);
    $('#dnx').textContent = nx ? 'Ensuite : ' + nx.label + ' (' + mmss(nx.s) + ')' : 'Dernière phase';
    $('#db').style.width = Math.max(0, Math.min(100, (1 - T.left / p.s) * 100)) + '%';
    $('#dock').classList.toggle('fast', p.kind === 'f');
    const pp = $('[data-t="pp"]'); pp.textContent = T.paused ? '▶' : '❚❚'; pp.setAttribute('aria-label', T.paused ? 'Reprendre' : 'Pause');
  }
  function hiitPhases() {
    const n = cyc(), ph = [{ label: 'Échauffement', s: 240, kind: 'w' }];
    for (let i = 1; i <= n; i++) { ph.push({ label: `Effort rapide ${i}/${n}`, s: 30, kind: 'f' }); ph.push({ label: 'Récupération (marche)', s: 90, kind: 'r' }); }
    ph.push({ label: 'Retour au calme', s: 180, kind: 'w' });
    return ph;
  }
  let toastT = 0;
  function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (el.hidden = true), 1800); }

  /* ---------- événements ---------- */
  function updateProgressUI() {
    const d = DAYS.find((x) => x.id === curView);
    if (d && d.type === 'train') { const m = $('#setmeta'); if (m) m.textContent = `≈ ${d.mus} min · ${setsDone(d)}/${setCount(d)} séries`; }
    renderTop();
  }
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-act]');
    if (!b || b.tagName === 'INPUT') return;
    const act = b.dataset.act, d = DAYS.find((x) => x.id === curView);
    if (act === 'toggle') {
      const li = b.closest('.ex'), body = $('.exbody', li), open = b.getAttribute('aria-expanded') !== 'true';
      b.setAttribute('aria-expanded', open); body.hidden = !open;
      const box = $('.figbox', li);
      if (open) { mountFig(box, true); const st = figs.get(box); if (st && !REDUCED && !st.playing) { st.playing = true; syncPlayBtn(st); kick(); } }
      else { const st = figs.get(box); if (st) { st.playing = false; } }
    } else if (act === 'set') {
      const li = b.closest('.ex'), key = li.dataset.key, sets = +li.dataset.sets, j = +b.dataset.j, w = W();
      const cur = w.sets[key] || 0, nw = cur === j ? j - 1 : j;
      w.sets[key] = nw; save();
      $$('.set', li).forEach((s, i) => s.setAttribute('aria-pressed', i < nw));
      li.dataset.done = nw >= sets ? 1 : 0;
      if (nw > cur && nw < sets && S.auto) startTimer([{ label: 'Repos', s: +li.dataset.rest, kind: 'r' }], $('.exname', li).textContent, `var(--${d.hue})`);
      else if (nw >= sets && nw > cur) { toast('Exercice terminé'); stopTimer(); }
      updateProgressUI();
    } else if (act === 'rest') {
      const li = b.closest('.ex');
      startTimer([{ label: 'Repos', s: +b.dataset.secs, kind: 'r' }], $('.exname', li).textContent, `var(--${d.hue})`);
    } else if (act === 'play') {
      const st = figs.get(b.closest('.figbox')); if (!st) return;
      st.playing = !st.playing; syncPlayBtn(st); if (st.playing) kick();
    } else if (act === 'cardiodone') {
      const w = W(); w.cardio[d.id] = !w.cardio[d.id]; save(); b.setAttribute('aria-pressed', !!w.cardio[d.id]); updateProgressUI();
    } else if (act === 'meal') {
      const w = W(), k = d.id + ':' + b.dataset.i; w.meals[k] = !w.meals[k]; save(); b.setAttribute('aria-pressed', !!w.meals[k]);
    } else if (act === 'autorest') {
      S.auto = !S.auto; save(); b.setAttribute('aria-pressed', S.auto);
    } else if (act === 'week') {
      S.week = +b.dataset.w; save(); renderAll();
    } else if (act === 'cyc') {
      const n = Math.min(8, Math.max(3, cyc() + +b.dataset.d)); S.cyc[S.week] = n; save();
      $('#cycv').textContent = n; $('#cycn').textContent = n; $('#tl').innerHTML = tlHTML(n); $('#cyct').textContent = `cycles · ${4 + n * 2 + 3} min au total`;
    } else if (act === 'hiitstart') {
      startTimer(hiitPhases(), 'Fractionné', `var(--${d.hue})`);
    } else if (act === 'walkstart') {
      startTimer([{ label: 'Marche inclinée', s: +b.dataset.mins * 60, kind: 'w' }], 'Cardio', `var(--${d.hue})`);
    }
  });
  let svT = 0;
  document.addEventListener('input', (ev) => {
    const el = ev.target, act = el.dataset && el.dataset.act;
    if (act === 'scrub') {
      const st = figs.get(el.closest('.figbox')); if (!st) return;
      st.playing = false; syncPlayBtn(st); st.u = el.value / 100; draw(st);
    } else if (act === 'suivi') {
      S.suivi[el.dataset.r] = S.suivi[el.dataset.r] || {}; S.suivi[el.dataset.r][el.dataset.f] = el.value;
      clearTimeout(svT); svT = setTimeout(save, 500);
    }
  });
  $('#dock').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-t]'); if (!b) return; const t = b.dataset.t;
    if (t === 'x') stopTimer();
    else if (t === 'pp') { T.paused = !T.paused; T.last = performance.now(); renderDock(); }
    else { T.left = Math.max(1, T.left + (t === '+15' ? 15 : -15)); const p = T.ph[T.i]; if (T.left > p.s) p.s = T.left; renderDock(); }
  });
  $('#themebtn').addEventListener('click', () => { S.theme = effTheme() === 'dark' ? 'light' : 'dark'; save(); applyTheme(); });
  window.addEventListener('hashchange', route);
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {} }

  /* ---------- démarrage ---------- */
  applyTheme(); renderTop(); route();
  initRemote();
  setTimeout(() => { if (!remote) initRemote(); }, 2500);
})();

</script>
</body></html>
